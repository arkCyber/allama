[package]
name = "allama"
version = "1.0.0"
edition = "2021"
description = "Aerospace-Level Security Enhanced LLM Inference Engine - Aligned with Ollama"
authors = ["arkCyber"]
license = "MIT"
repository = "https://github.com/arkCyber/allama"
readme = "README.md"
keywords = ["llm", "ai", "installer", "aerospace", "security"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures-util = "0.3"
async-stream = "0.3"
uuid = { version = "1.6", features = ["v4", "serde"] }

# HTTP client for downloads
reqwest = { version = "0.11", features = ["json", "stream"] }

# HTTP server for API
axum = "0.7"
tower = { version = "0.4", features = ["limit"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
tower-layer = "0.3"
hyper = "1.0"
http-body-util = "0.1"

# File operations
dirs = "5.0"
fs_extra = "1.3"

# Compression
zip = "0.6"
flate2 = "1.0"
tar = "0.4"

# Version comparison
semver = "1.0"

# System operations
sysinfo = "0.30"
which = "6.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.10"

# Platform-specific dependencies
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
winapi = { version = "0.3", features = ["winuser", "shellapi"] }
windows-service = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
core-foundation = "0.9"
core-graphics = "0.23"
security-framework = "2.9"

[target.'cfg(unix)'.dependencies]
nix = "0.27"
systemd = { version = "0.10", optional = true }

# Aerospace-level security dependencies
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# Database for billing statistics (aerospace-level reliability)
rusqlite = { version = "0.30", features = ["bundled"] }

[features]
default = []
systemd = ["dep:systemd"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
